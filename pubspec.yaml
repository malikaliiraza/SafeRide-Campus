publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
